<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Resultados exploratórios das versões A e B</title>
  <desc id="desc">Comparação de F1 lexical médio, aprovações humanas R1 e sinais automáticos positivos. A e B tiveram seis casos por versão; R2 concordou com R1 em quatro de quatro revisões.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #202124; }
    .title { font-size: 24px; font-weight: 700; }
    .panel { font-size: 17px; font-weight: 700; }
    .label { font-size: 14px; }
    .tick { font-size: 12px; fill: #5f6368; }
    .value { font-size: 14px; font-weight: 700; }
    .axis { stroke: #70757a; stroke-width: 1; }
    .grid { stroke: #dadce0; stroke-width: 1; }
    .a { fill: #3976c5; }
    .b { fill: #e58b2a; }
    .note { font-size: 13px; fill: #5f6368; }
  </style>
  <rect width="1100" height="500" fill="#ffffff"/>
  <text x="550" y="40" text-anchor="middle" class="title">Resultados por versão (seis casos em cada)</text>
  <rect x="440" y="57" width="14" height="14" class="a"/>
  <text x="460" y="69" class="label">A</text>
  <rect x="505" y="57" width="14" height="14" class="b"/>
  <text x="525" y="69" class="label">B</text>

  <text x="180" y="105" text-anchor="middle" class="panel">F1 lexical médio</text>
  <line x1="55" y1="320" x2="305" y2="320" class="axis"/>
  <line x1="55" y1="275" x2="305" y2="275" class="grid"/>
  <line x1="55" y1="230" x2="305" y2="230" class="grid"/>
  <line x1="55" y1="185" x2="305" y2="185" class="grid"/>
  <line x1="55" y1="140" x2="305" y2="140" class="grid"/>
  <text x="45" y="324" text-anchor="end" class="tick">0</text>
  <text x="45" y="279" text-anchor="end" class="tick">0,25</text>
  <text x="45" y="234" text-anchor="end" class="tick">0,50</text>
  <text x="45" y="189" text-anchor="end" class="tick">0,75</text>
  <text x="45" y="144" text-anchor="end" class="tick">1,00</text>
  <rect x="105" y="233.8" width="55" height="86.2" class="a"/>
  <rect x="205" y="229.4" width="55" height="90.6" class="b"/>
  <text x="132" y="225" text-anchor="middle" class="value">0,479</text>
  <text x="232" y="221" text-anchor="middle" class="value">0,503</text>
  <text x="132" y="344" text-anchor="middle" class="label">A</text>
  <text x="232" y="344" text-anchor="middle" class="label">B</text>

  <text x="550" y="105" text-anchor="middle" class="panel">Aprovação humana R1</text>
  <line x1="425" y1="320" x2="675" y2="320" class="axis"/>
  <line x1="425" y1="290" x2="675" y2="290" class="grid"/>
  <line x1="425" y1="260" x2="675" y2="260" class="grid"/>
  <line x1="425" y1="230" x2="675" y2="230" class="grid"/>
  <line x1="425" y1="200" x2="675" y2="200" class="grid"/>
  <line x1="425" y1="170" x2="675" y2="170" class="grid"/>
  <line x1="425" y1="140" x2="675" y2="140" class="grid"/>
  <text x="415" y="324" text-anchor="end" class="tick">0</text>
  <text x="415" y="294" text-anchor="end" class="tick">1</text>
  <text x="415" y="264" text-anchor="end" class="tick">2</text>
  <text x="415" y="234" text-anchor="end" class="tick">3</text>
  <text x="415" y="204" text-anchor="end" class="tick">4</text>
  <text x="415" y="174" text-anchor="end" class="tick">5</text>
  <text x="415" y="144" text-anchor="end" class="tick">6</text>
  <rect x="475" y="140" width="55" height="180" class="a"/>
  <rect x="575" y="140" width="55" height="180" class="b"/>
  <text x="502" y="132" text-anchor="middle" class="value">6/6</text>
  <text x="602" y="132" text-anchor="middle" class="value">6/6</text>
  <text x="502" y="344" text-anchor="middle" class="label">A</text>
  <text x="602" y="344" text-anchor="middle" class="label">B</text>

  <text x="920" y="105" text-anchor="middle" class="panel">Sinal automático positivo</text>
  <line x1="795" y1="320" x2="1045" y2="320" class="axis"/>
  <line x1="795" y1="290" x2="1045" y2="290" class="grid"/>
  <line x1="795" y1="260" x2="1045" y2="260" class="grid"/>
  <line x1="795" y1="230" x2="1045" y2="230" class="grid"/>
  <line x1="795" y1="200" x2="1045" y2="200" class="grid"/>
  <line x1="795" y1="170" x2="1045" y2="170" class="grid"/>
  <line x1="795" y1="140" x2="1045" y2="140" class="grid"/>
  <text x="785" y="324" text-anchor="end" class="tick">0</text>
  <text x="785" y="294" text-anchor="end" class="tick">1</text>
  <text x="785" y="264" text-anchor="end" class="tick">2</text>
  <text x="785" y="234" text-anchor="end" class="tick">3</text>
  <text x="785" y="204" text-anchor="end" class="tick">4</text>
  <text x="785" y="174" text-anchor="end" class="tick">5</text>
  <text x="785" y="144" text-anchor="end" class="tick">6</text>
  <rect x="845" y="260" width="55" height="60" class="a"/>
  <rect x="945" y="230" width="55" height="90" class="b"/>
  <text x="872" y="252" text-anchor="middle" class="value">2/6</text>
  <text x="972" y="222" text-anchor="middle" class="value">3/6</text>
  <text x="872" y="344" text-anchor="middle" class="label">A</text>
  <text x="972" y="344" text-anchor="middle" class="label">B</text>

  <text x="550" y="395" text-anchor="middle" class="note">Sinal automático: F1 ≥ 0,5; limiar escolhido após as execuções (exploratório).</text>
  <text x="550" y="418" text-anchor="middle" class="note">R1: 6/6 aprovações em cada versão. R1–R2: 4/4 decisões concordantes nas saídas revisadas.</text>
  <text x="550" y="441" text-anchor="middle" class="note">F1 lexical mede sobreposição de palavras e não demonstra, sozinho, correção ou superioridade.</text>
</svg>
